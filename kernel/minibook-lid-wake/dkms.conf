PACKAGE_NAME="minibook-lid-wake"
PACKAGE_VERSION="0.1"
CLEAN="make clean"
# Not every installed kernel uses the same toolchain (e.g. cachyos is
# Clang-built, cachyos-lts is GCC-built): forcing LLVM=1 unconditionally
# makes DKMS invoke clang against a GCC-configured kernel tree, which
# fails on GCC-only flags the kernel's build system bakes in for it.
if grep -q '^CONFIG_CC_IS_CLANG=y' "/lib/modules/$kernelver/build/.config" 2>/dev/null; then
    llvm_arg="LLVM=1"
else
    llvm_arg=""
fi
MAKE[0]="make all KDIR=/lib/modules/$kernelver/build $llvm_arg"
BUILT_MODULE_NAME[0]="minibook_lid_wake"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
